const lbl=(mode==='2p'||mode==='tag')&&selStep===0?(mode==='tag'?'리더 확정 ▶':'P1 확정 ▶'):mode==='train'?'연습 시작':mode==='story'?'스토리 시작':mode==='survival'?'서바이벌 시작':'대전 시작';
const go=()=>{
save();
if((mode==='2p'||mode==='tag')&&selStep===0){selStep=1;if(mode==='tag'&&sel2===sel)sel2=nextUn(sel,1);return;}
if(mode==='tag'&&sel2===sel){toast('서로 다른 캐릭터를 선택하세요');return;}
if(mode==='story'){startStory(sel);return;}
startMatch();
};
const cyc=d=>{opt.stg=(opt.stg+d+STG.length+1)%(STG.length+1);save();};
const sl='스테이지  '+(opt.stg>0?STG[opt.stg-1].n:'랜덤');
const showDif=mode!=='2p';
const dl='난이도  ◀ '+DIFFS[diffIdx].n+' ▶';
const cd=d=>{diffIdx=(diffIdx+d+3)%3;save();};
const hint=mode==='story'?'◀ ▶ 캐릭터 선택  ·  보스전은 항상 최고 난이도':mode==='survival'?'◀ ▶ 캐릭터 선택  ·  연승할수록 난이도 상승':'◀ ▶ 캐릭터 선택   ENTER 확정';
if(PORT){
const bh=Math.round(56*u),sh=Math.round(46*u),y2=by+bh+8;
drawBtn(W/2-120,by,240,bh,lbl,go,{size:24});
if(showDif&&showStg){drawBtn(W/2-190,y2,185,sh,dl,()=>{cd(1);},{size:15,lr:cd});drawBtn(W/2+5,y2,185,sh,sl,()=>{cyc(1);},{size:15,lr:cyc});}
else if(showDif)drawBtn(W/2-130,y2,260,sh,dl,()=>{cd(1);},{size:19,lr:cd});
else if(showStg)drawBtn(W/2-130,y2,260,sh,sl,()=>{cyc(1);},{size:19,lr:cyc});
txt(hint,W/2,y2+sh+22,13,'#bdb6ff',null,0,null,'700');
}else{
drawBtn(540,by,400,52,lbl,go,{size:24});
if(showDif&&showStg){drawBtn(30,by,240,52,dl,()=>{cd(1);},{size:17,lr:cd});drawBtn(280,by,240,52,sl,()=>{cyc(1);},{size:17,lr:cyc});}
else if(showDif)drawBtn(30,by,300,52,dl,()=>{cd(1);},{size:19,lr:cd});
else if(showStg)drawBtn(30,by,300,52,sl,()=>{cyc(1);},{size:19,lr:cyc});
txt(hint,275,456,13,'#bdb6ff',null,0,null,'700');
}
drawBtn(24,24,110,40,'◀ 뒤로',backSel,{size:18});
}
function drawPauseUI(){
dimmer(0.6);
if(showSet){drawSet();return;}
if(G.train&&!G.tut){
const bw=PORT?340:300,bh=PORT?50:52,st=PORT?58:64;
const lx=PORT?(W-bw)/2:W/2-310,rx=PORT?lx:W/2+10;
const y0=PORT?Math.round((H-9*st)/2)+26:130,ry=PORT?y0+4*st:y0;
txt('PAUSE  ·  연습 모드',W/2,PORT?y0-40:70,PORT?30:40,'#fff',null,8,'#3a0d6b');
const cyc=d=>{dummyMode=(dummyMode+d+DUMMY.length)%DUMMY.length;};
drawBtn(lx,y0,bw,bh,'계속하기',()=>{togglePause();},{size:22});
drawBtn(lx,y0+st,bw,bh,'위치 초기화',()=>{resetF(G.f[0],650,1);resetF(G.f[1],950,-1);G.projs.length=0;G.noHit=0;},{size:22});
drawBtn(lx,y0+st*2,bw,bh,'더미  '+DUMMY[dummyMode],()=>{cyc(1);},{size:22,lr:cyc});
drawBtn(lx,y0+st*3,bw,bh,'더미 캐릭터  '+CHARS[dummyCi].name,()=>{dummyCi=(dummyCi+1)%NCH;G.f[1]=mkF(dummyCi,false);resetF(G.f[1],950,-1);G.projs.length=0;},{size:22});
drawBtn(rx,ry,bw,bh,'히트박스  '+(G.showBox?'ON':'OFF'),()=>{G.showBox=!G.showBox;},{size:22});
drawBtn(rx,ry+st,bw,bh,'게이지  '+(G.trainSp?'무한':'일반'),()=>{G.trainSp=!G.trainSp;},{size:22});
drawBtn(rx,ry+st*2,bw,bh,'설정',()=>{showSet=true;foc=0;},{size:22});
drawBtn(rx,ry+st*3,bw,bh,'캐릭터 선택',()=>{setScene('select');},{size:22});
drawBtn(rx,ry+st*4,bw,bh,'타이틀로',()=>{setScene('title');},{size:22});
return;
}
const by=PORT?Math.round(H*0.36):200;
txt('PAUSE',W/2,PORT?Math.round(H*0.28):130,PORT?60:70,'#fff',null,10,'#3a0d6b');
txt('난이도  '+DIFFS[aiLv].n,W/2,PORT?Math.round(H*0.28)+46:176,16,'#bdb6ff',null,3,'#000');
const bx=W/2-150;
drawBtn(bx,by,300,54,'계속하기',()=>{togglePause();},{size:24});
drawBtn(bx,by+66,300,54,'다시 시작',()=>{startMatch();},{size:24});
drawBtn(bx,by+132,300,54,'설정',()=>{showSet=true;foc=0;},{size:24});
drawBtn(bx,by+198,300,54,'타이틀로',()=>{setScene('title');},{size:24});
}
function drawStoryOver(){
const ry=PORT?Math.round(H*0.25):130;
txt('GAME OVER',W/2,ry,PORT?66:84,'#ff5a4a',null,12,'#2a0000');
txt('STAGE '+(ST.i+1)+' / 6   ·   vs '+CHARS[ST.seq[ST.i]].name,W/2,ry+62,22,'#fff',null,5,'#000');
const bx=W/2-160,by=ry+104;
if(ST.cont>0)drawBtn(bx,by,320,56,'이어서 도전  (남은 '+ST.cont+'회)',()=>{ST.cont--;ST.used++;mode='story';startMatch();},{size:21});
else txt('이어하기 횟수를 모두 사용했습니다',W/2,by+28,17,'#bdb6ff',null,3,'#000');
drawBtn(bx,by+68,320,56,'처음부터 다시',()=>{startStory(ST.ci);},{size:21});
drawBtn(bx,by+136,320,56,'타이틀로',()=>{setScene('title');},{size:21});
}
function drawStoryFin(){
const ry=PORT?Math.round(H*0.14):70,c=CHARS[ST.ci];
portrait(c,W/2,ry+(PORT?36:20),PORT?62:48,false);
const ty=ry+(PORT?118:96);
txt('STORY CLEAR!',W/2,ty,PORT?46:52,'#ffd54a',null,10,'#7a3a00');
txt('RANK  '+RKL[ST.rank],W/2,ty+(PORT?58:54),PORT?40:42,'#fff',null,8,'#3a0d6b');
txt('이어하기 '+ST.used+'회 사용',W/2,ty+(PORT?100:94),16,'#bdb6ff',null,3,'#000');
let yy=ty+(PORT?136:128);
if(ST.unl>=0){
txt('NEW CHALLENGER!',W/2,yy,PORT?28:26,(tick>>3)&1?'#7fe9ff':'#ffffff',null,6,'#0a2a55');
txt('해금: '+CHARS[ST.unl].name+'  ('+CHARS[ST.unl].tag+')',W/2,yy+32,18,'#fff',null,4,'#000');
yy+=PORT?64:62;
}
if(PORT){
drawBtn(W/2-150,yy+10,300,54,'타이틀로',()=>{setScene('title');},{size:22});
drawBtn(W/2-150,yy+76,300,54,'다시 도전',()=>{startStory(ST.ci);},{size:22});
}else{
drawBtn(W/2-310,Math.max(yy,440),300,52,'타이틀로',()=>{setScene('title');},{size:22});
drawBtn(W/2+10,Math.max(yy,440),300,52,'다시 도전',()=>{startStory(ST.ci);},{size:22});
}
}
function drawStory(){
curStage=ST.stg[Math.min(ST.i,5)];
drawStageBG(800,1);
dimmer(0.6);
const k=ST.kind;
if(k==='fin'){drawStoryFin();return;}
if(k==='over'){drawStoryOver();return;}
const oc=ST.seq[Math.min(ST.i,5)],ln=ST.lines[ST.li],sp=ln?ln.s:-1;
const r=PORT?72:100,py0=PORT?Math.round(H*0.22):222,lx=PORT?120:170,rx=PORT?W-120:W-170;
txt(k==='end'?'ENDING':(ST.i===5?'FINAL STAGE':'STAGE '+(ST.i+1)+' / 6'),W/2,36,PORT?24:28,'#ffd54a',null,6,'#2a0a55');
if(k==='end'){portrait(CHARS[ST.ci],W/2,py0,r*1.25,false);}
else{
ctx.globalAlpha=(sp===ST.ci)?1:0.4;portrait(CHARS[ST.ci],lx,py0,r,false);
ctx.globalAlpha=(sp===oc)?1:0.4;portrait(CHARS[oc],rx,py0,r,true);
ctx.globalAlpha=1;
if(k==='pre')txt('VS',W/2,py0,PORT?40:56,'#fff',null,8,'#3a0d6b');
}
const pw=PORT?W-32:840,px=(W-pw)/2,ph=PORT?200:138,py=PORT?Math.round(H*(H<700?0.52:0.5)):372;
ctx.save();poly([px,py,px+pw,py,px+pw-10,py+ph,px+10,py+ph]);ctx.fillStyle='rgba(16,12,44,0.93)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#2ef2ff';ctx.stroke();ctx.restore();
if(ln){
if(ln.s>=0){
const nmv=CHARS[ln.s].name;
ctx.save();poly([px+14,py-16,px+144,py-16,px+134,py+10,px+4,py+10]);ctx.fillStyle='#2ef2ff';ctx.fill();ctx.restore();
txt(nmv,px+74,py-3,18,'#10102a',null,0,null,'900');
}
const mw=PORT?pw-44:pw-230,sz=PORT?19:22;
if(ST.wk!==ln.t+'|'+mw){ST.wk=ln.t+'|'+mw;ST.wl=wrapLines(ln.t,mw,sz);}
for(let i=0;i<ST.wl.length&&i<4;i++)txt(ST.wl[i],px+24,py+(PORT?36:36)+i*(PORT?27:30),sz,'#fff','left',0,null,'700');
}
if(PORT)drawBtn(W/2-80,py+ph-52,160,40,'다음 ▶',storyAdv,{size:18});
else drawBtn(px+pw-170,py+ph-52,150,38,'다음 ▶',storyAdv,{size:18});
drawBtn(W-134,20,110,34,'SKIP ▶▶',()=>{ST.li=ST.lines.length-1;storyAdv();},{size:14});
addHit(0,0,W,H,storyAdv);
}
function drawResult(){
if(mode==='survival'){
dimmer(0.6);
const ry=PORT?Math.round(H*0.24):120;
txt('SURVIVAL',W/2,ry,PORT?56:70,'#ff5a4a',null,12,'#2a0000');
txt(SU.n+' 연승',W/2,ry+(PORT?74:80),PORT?58:64,'#ffd54a',null,10,'#7a3a00');
txt('최고 기록  '+SV.sb+'연승',W/2,ry+(PORT?130:140),22,'#fff',null,5,'#000');
const bx=W/2-150,by=ry+(PORT?170:180);
drawBtn(bx,by,300,54,'다시 도전',()=>{startMatch();},{size:24});
drawBtn(bx,by+66,300,54,'캐릭터 선택',()=>{setScene('select');},{size:24});
drawBtn(bx,by+132,300,54,'타이틀로',()=>{setScene('title');},{size:24});
return;
}

dimmer(0.55);
const win=G.wins[0]>G.wins[1],ry=PORT?Math.round(H*0.28):140;
ctx.save();ctx.translate(W/2,ry);
const gold=win||G.two;
txt(G.two?(win?'P1 WIN':'P2 WIN'):(win?'VICTORY':'DEFEAT'),0,0,PORT?84:96,gold?'#ffd54a':'#ff5a4a',null,12,gold?'#7a3a00':'#2a0000');
ctx.restore();
txt(G.tag?'TAG MATCH   '+G.wins[0]+' : '+G.wins[1]:G.f[0].ch.en+'  '+G.wins[0]+' : '+G.wins[1]+'  '+G.f[1].ch.en,W/2,ry+75,PORT?26:30,'#fff',null,6,'#000');
const bx=W/2-150,by=ry+120;
drawBtn(bx,by,300,54,'다시 대전',()=>{startMatch();},{size:24});
drawBtn(bx,by+66,300,54,'캐릭터 선택',()=>{setScene('select');},{size:24});
drawBtn(bx,by+132,300,54,'타이틀로',()=>{setScene('title');},{size:24});
}

function render(){
ctx.setTransform(S,0,0,S,0,0);
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
btns.length=0;navN=0;
if(scene==='title')drawTitle();
else if(scene==='select')drawSelect();
else if(scene==='story')drawStory();
else{
drawFight();
if(scene==='fight'){
bigMsg();
if(paused)drawPauseUI();
else if(G.tut&&TS.done)drawTutDone();
else{
poly([W-52,100,W-14,100,W-14,136,W-52,136]);ctx.fillStyle='rgba(20,14,50,0.8)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
ctx.fillStyle='#fff';ctx.fillRect(W-40,108,6,20);ctx.fillRect(W-28,108,6,20);
addHit(W-52,100,38,36,togglePause);
}
}else drawResult();
}
if(toastT>0){
toastT--;
const tw=Math.min(W-40,420),tx=(W-tw)/2,ty=PORT?H-120:H-70;
ctx.save();ctx.globalAlpha=Math.min(1,toastT/20);
poly([tx,ty,tx+tw,ty,tx+tw-8,ty+40,tx+8,ty+40]);ctx.fillStyle='rgba(16,12,44,0.95)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffd54a';ctx.stroke();
txt(toastS,W/2,ty+21,16,'#fff',null,0,null,'700');
ctx.restore();
}
}
let last=0,acc=0;
function step(){
tick++;
if(rstArm>0)rstArm--;
if(scene==='title'){for(let i=0;i<2;i++)demoStep(DEMOS[i],false);if(tick%1200===0)rotDemo();}
else if(scene==='select'){for(let i=0;i<SELD.length;i++)demoStep(SELD[i],true);}
else if(scene==='fight'){stepFight();updHints();if(!paused&&G.phase==='play'&&isStat())SV.tf++;padEl.u.classList.toggle('rdy',G.f[0].sp>=100);}
else stepFx();
}
function frame(ts){
if(!last)last=ts;
let dt=ts-last;last=ts;
if(dt>100)dt=100;
acc+=dt;
while(acc>=16.667){step();acc-=16.667;}
alp=acc/16.667;
bgmTick();
render();
requestAnimationFrame(frame);
}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(screenEl);
addEventListener('resize',resize);
applyOpt();
addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
